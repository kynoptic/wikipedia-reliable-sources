repos:
  - repo: local
    hooks:
      - id: commit-body-format
        name: Commit body bullet format
        language: script
        entry: build-tools/quality-checks/check-commit-body.sh
        stages: [commit-msg]

      # Patterns and the allow-list live in this repo's git config and .gitallowed,
      # so the scan uses the same rules whether pre-commit or git invokes it.
      - id: git-secrets
        name: Secret scan
        language: script
        entry: build-tools/quality-checks/secret-scan.sh
        pass_filenames: false

      # `language: system` runs against this repo's node_modules, where the
      # markdownlint-styleguide custom rules resolve; an isolated environment would
      # silently skip every custom rule. `pass_filenames: false` stops cli2
      # re-evaluating its globs once per file argument.
      - id: markdownlint
        name: Markdown lint
        language: system
        entry: npx markdownlint-cli2
        files: \.md$
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # .vscode config is JSONC; comments are valid there but not JSON.
        exclude: ^\.vscode/
